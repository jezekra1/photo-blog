# Builds the self-hosted image on every push to main, which includes GitHub's
# "Sync fork" button. Fork-only: everything else (Dockerfile, build settings,
# deploy) lives in the private jezekra1/provision-k8s repo, so this is the one
# file that differs from upstream. Upstream has no .github/workflows, so
# syncing never conflicts.
#
# Deploys happen in the cluster: a CronJob rolls out the newest commit's image
# within 30 minutes of it appearing here (or `make deploy-photo-blog` in
# provision-k8s).
#
# Setup (once):
# - Actions secret PROVISION_K8S_DEPLOY_KEY: private half of a read-only deploy
#   key on jezekra1/provision-k8s.
# - Package ghcr.io/jezekra1/photo-blog → Package settings → Manage Actions
#   access: add this repository with the Write role.
# - Optional Actions variable PROVISION_K8S_REF (default: main).

name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'jezekra1/photo-blog'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the blog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: Check out the build files from provision-k8s
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jezekra1/provision-k8s
          ref: ${{ vars.PROVISION_K8S_REF || 'main' }}
          ssh-key: ${{ secrets.PROVISION_K8S_DEPLOY_KEY }}
          path: infra
          sparse-checkout: apps/photo-blog
          persist-credentials: false

      # Public build-time settings only, same as `make build-photo-blog`.
      - name: Write .env.production
        run: |
          { cat infra/apps/photo-blog/build.env; echo; cat infra/apps/photo-blog/build.terraform.env; } \
            > app/.env.production
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          file: infra/apps/photo-blog/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/jezekra1/photo-blog:${{ env.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Built \`ghcr.io/jezekra1/photo-blog:${tag}\`. Deploy: \`make deploy-photo-blog\` in provision-k8s." >> "$GITHUB_STEP_SUMMARY"
